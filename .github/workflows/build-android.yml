name: build-android

on:
  workflow_dispatch:
  push:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake clang libclang-dev llvm-dev \
            ninja-build pkg-config curl unzip zip

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # Android NDK r26c — needed by cc-rs for C deps (zstd-sys etc.)
      - name: Install Android NDK
        run: |
          curl -L --retry 3 -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r26c-linux.zip
          unzip -q /tmp/ndk.zip -d /opt/
          mv /opt/android-ndk-r26c /opt/android-ndk
          NDK_BIN=/opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin
          echo "$NDK_BIN" >> "$GITHUB_PATH"
          # cc-rs looks for `aarch64-linux-android-clang` without API level
          ln -sf "$NDK_BIN/aarch64-linux-android24-clang" "$NDK_BIN/aarch64-linux-android-clang"
          ln -sf "$NDK_BIN/aarch64-linux-android24-clang++" "$NDK_BIN/aarch64-linux-android-clang++"
          ln -sf "$NDK_BIN/llvm-ar" "$NDK_BIN/aarch64-linux-android-ar"
          echo "CC_aarch64_linux_android=aarch64-linux-android-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=aarch64-linux-android-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=aarch64-linux-android-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=aarch64-linux-android-clang" >> "$GITHUB_ENV"

      # bionic lacks strtof_l/strtod_l/__clear_cache symbols (glibc-isms
      # pulled in by V8/ICU) at the api-24 libc target. Provide asm stubs,
      # linked into the final android binary only.
      - name: Build bionic stub
        run: |
          NDK_BIN=/opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin
          "$NDK_BIN/aarch64-linux-android24-clang" \
            -c "$GITHUB_WORKSPACE/scripts/bionic-stub.S" \
            -o "$RUNNER_TEMP/bionic-stub.o"
          echo "STUB_OBJ=$RUNNER_TEMP/bionic-stub.o" >> "$GITHUB_ENV"
          ls -la "$RUNNER_TEMP/bionic-stub.o"

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@v2

      # v8 crate's build/android/ is missing .pydeps files (rusty_v8 137.3.0 bug
      # on android cross-compile). gn gen fails reading them.
      # cargo fetch only downloads .crate caches; extraction to registry/src
      # happens at build time. So manually extract v8 and create the files.
      - name: Fetch deps and fix v8 missing pydeps
        run: |
          cargo fetch --target aarch64-linux-android
          CACHE=$(find "$HOME/.cargo/registry/cache" -name "v8-137.3.0.crate" | head -1)
          echo "cache: $CACHE"
          if [ -n "$CACHE" ]; then
            HASH_DIR=$(dirname "$CACHE")
            SRC_HASH=$(basename "$HASH_DIR")
            mkdir -p "$HOME/.cargo/registry/src/$SRC_HASH"
            tar xzf "$CACHE" -C "$HOME/.cargo/registry/src/$SRC_HASH"
            V8_SRC="$HOME/.cargo/registry/src/$SRC_HASH/v8-137.3.0"
            touch "$V8_SRC/.cargo-ok"
            echo "v8 extracted: $V8_SRC"
            # 让 rusty_v8 build.rs 复用已装 NDK, 跳过它自己下载 (600MB)
            mkdir -p "$V8_SRC/third_party"
            ln -sfn /opt/android-ndk "$V8_SRC/third_party/android_ndk"
            echo "NDK linked into v8 third_party"
            cd "$V8_SRC/build/android"
            grep -rhoE '"[^"]+\.pydeps"' --include="BUILD.gn" . 2>/dev/null | tr -d '"' | sort -u | while read -r f; do
              f=$(echo "$f" | sed 's|^//build/||')
              if [ ! -f "$f" ]; then
                mkdir -p "$(dirname "$f")"
                touch "$f"
                echo "created missing pydeps: $f"
              fi
            done
            cd "$V8_SRC/build"
            grep -rhoE '"[^"]+\.pydeps"' --include="BUILD.gn" android/ 2>/dev/null | tr -d '"' | sort -u | while read -r f; do
              f=$(echo "$f" | sed 's|^//build/||')
              if [ ! -f "$f" ]; then
                mkdir -p "$(dirname "$f")"
                touch "$f"
                echo "created missing pydeps (top): $f"
              fi
            done
          else
            echo "WARN: v8 crate cache not found"
          fi

      # no-render + stealth (smallest, no CSS layout)
      - name: Build no-render stealth
        run: |
          cargo build --release -p obscura-cli --bins \
            --target aarch64-linux-android \
            --no-default-features --features stealth
        env:
          V8_FROM_SOURCE: "1"
          # V8 android build needs the NDK sysroot (bionic headers); rusty_v8
          # downloads a Debian sysroot instead, so point gn at the NDK.
          GN_ARGS: 'android_ndk_root="/opt/android-ndk"'
          # link bionic stub (strtof_l/strtod_l/__clear_cache)
          CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS: "-C link-arg=${{ env.STUB_OBJ }}"

      # render + stealth (full: layout, screenshot, PDF)
      - name: Build render stealth
        run: |
          cargo build --release -p obscura-cli --bins \
            --target aarch64-linux-android \
            --features render,stealth
        env:
          V8_FROM_SOURCE: "1"
          GN_ARGS: 'android_ndk_root="/opt/android-ndk"'
          CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS: "-C link-arg=${{ env.STUB_OBJ }}"

      - name: Collect artifacts
        run: |
          mkdir -p dist
          for f in target/aarch64-linux-android/release/obscura target/aarch64-linux-android/release/obscura-worker; do
            if [ -f "$f" ]; then cp "$f" dist/; fi
          done
          ls -lh dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="android-${{ github.run_id }}"
          gh release create "$TAG" dist/* \
            --repo "${{ github.repository }}" \
            --title "Obscura Android aarch64 build" \
            --notes "Auto-built from commit ${{ github.sha }}. Obscura v0.2.1 cross-compiled for aarch64-linux-android (Termux)." || echo "release 创建失败(可能 tag 已存在)"

      - name: Upload artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: obscura-android-aarch64
          path: dist/
          retention-days: 14