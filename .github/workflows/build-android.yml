name: build-android

on:
  workflow_dispatch:
  push:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake clang libclang-dev llvm-dev \
            ninja-build pkg-config curl unzip zip

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # Android NDK r26c — needed by cc-rs for C deps (zstd-sys etc.)
      - name: Install Android NDK
        run: |
          curl -L --retry 3 -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r26c-linux.zip
          unzip -q /tmp/ndk.zip -d /opt/
          mv /opt/android-ndk-r26c /opt/android-ndk
          NDK_BIN=/opt/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin
          echo "$NDK_BIN" >> "$GITHUB_PATH"
          # cc-rs looks for `aarch64-linux-android-clang` without API level
          ln -sf "$NDK_BIN/aarch64-linux-android24-clang" "$NDK_BIN/aarch64-linux-android-clang"
          ln -sf "$NDK_BIN/aarch64-linux-android24-clang++" "$NDK_BIN/aarch64-linux-android-clang++"
          ln -sf "$NDK_BIN/llvm-ar" "$NDK_BIN/aarch64-linux-android-ar"
          echo "CC_aarch64_linux_android=aarch64-linux-android-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=aarch64-linux-android-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=aarch64-linux-android-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=aarch64-linux-android-clang" >> "$GITHUB_ENV"

      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@v2

      # no-render + stealth (smallest, no CSS layout)
      - name: Build no-render stealth
        run: |
          cargo build --release -p obscura-cli --bins \
            --target aarch64-linux-android \
            --no-default-features --features stealth
        env:
          V8_FROM_SOURCE: "1"

      # render + stealth (full: layout, screenshot, PDF)
      - name: Build render stealth
        run: |
          cargo build --release -p obscura-cli --bins \
            --target aarch64-linux-android \
            --features render,stealth
        env:
          V8_FROM_SOURCE: "1"

      - name: Collect artifacts
        run: |
          mkdir -p dist
          for f in target/aarch64-linux-android/release/obscura target/aarch64-linux-android/release/obscura-worker; do
            if [ -f "$f" ]; then cp "$f" dist/; fi
          done
          ls -lh dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="android-${{ github.run_id }}"
          gh release create "$TAG" dist/* \
            --repo "${{ github.repository }}" \
            --title "Obscura Android aarch64 build" \
            --notes "Auto-built from commit ${{ github.sha }}. Obscura v0.2.1 cross-compiled for aarch64-linux-android (Termux)." || echo "release 创建失败(可能 tag 已存在)"

      - name: Upload artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: obscura-android-aarch64
          path: dist/
          retention-days: 14