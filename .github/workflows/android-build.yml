name: Android aarch64 build

# Builds upstream Obscura for aarch64-linux-android (bionic).
#
# Android has no prebuilt rusty_v8 archive, so V8 is built from source with the
# NDK. The startup snapshot cannot be generated by V8's bundled mksnapshot:
# obscura-js/bootstrap.js needs the Deno.core bridge and the Web API globals
# that only deno_core + obscura install at runtime. This workflow therefore
# also builds `obscura-snapshot`, an arm64 binary that produces the snapshot on
# a real device; commit it as snapshot/OBSCURA_SNAPSHOT.bin and the final
# obscura build embeds it.
on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream obscura ref (branch, tag or sha)"
        required: false
        default: main
  push:
    branches: [android]

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      V8_FROM_SOURCE: "1"
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
      OBSCURA_REF: ${{ inputs.upstream_ref || 'main' }}
      ANDROID_API: "24"

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/node_modules /usr/share/swift /opt/az /usr/lib/jvm \
            /usr/local/share/powershell 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Checkout obscura
        uses: actions/checkout@v4
        with:
          repository: h4ckf0r0day/obscura
          ref: ${{ env.OBSCURA_REF }}
          path: src
          persist-credentials: false

      - name: Fetch workflow assets
        uses: actions/checkout@v4
        with:
          path: assets
          persist-credentials: false

      # The runner image already ships cmake, ninja and python3. apt is only a
      # fallback: apt mirrors on hosted runners intermittently fail to resolve
      # (azure.archive.ubuntu.com), so avoid a hard dependency on it.
      - name: Ensure cmake / ninja / python
        run: |
          set -euo pipefail
          if ! command -v cmake >/dev/null || ! command -v ninja >/dev/null; then
            sudo apt-get update -o Acquire::Retries=5 || true
            sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 \
              cmake ninja-build unzip
          fi
          cmake --version | head -1
          ninja --version
          python3 --version

      # bindgen needs libclang (the Chromium clang bundle is compiler-only and
      # ships no libclang.so), so keep a standalone LLVM just for that. GN still
      # uses the V8-pinned clang 23 below via CLANG_BASE_PATH.
      - name: Install LLVM 19 for libclang
        id: llvm
        continue-on-error: true
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "19"
          directory: ${{ runner.temp }}/llvm
          env: false

      - name: Configure libclang
        run: |
          set -euo pipefail
          LLVM_DIR="${LLVM_PATH:-}"
          if [ -z "$LLVM_DIR" ] || [ ! -e "$LLVM_DIR/lib/libclang.so" ]; then
            echo "prebuilt LLVM unavailable, falling back to apt (10 min cap)"
            timeout 600 sudo apt-get update -o Acquire::Retries=2 || true
            timeout 600 sudo apt-get install -y --no-install-recommends \
              -o Acquire::Retries=2 clang-19 libclang-19-dev
            LLVM_DIR=/usr/lib/llvm-19
          fi
          test -e "$LLVM_DIR/lib/libclang.so"
          echo "LIBCLANG_PATH=$LLVM_DIR/lib" >> "$GITHUB_ENV"
          ls "$LLVM_DIR/lib"/libclang.so*

      - name: Install Android NDK r26c
        run: |
          NDK_ROOT="$RUNNER_TEMP/android-ndk-r26c"
          if [ ! -d "$NDK_ROOT" ]; then
            curl -fL --retry 3 -o "$RUNNER_TEMP/ndk.zip" \
              https://dl.google.com/android/repository/android-ndk-r26c-linux.zip
            unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP"
            rm -f "$RUNNER_TEMP/ndk.zip"
          fi
          TOOLCHAIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64"
          {
            echo "ANDROID_NDK_HOME=$NDK_ROOT"
            echo "ANDROID_NDK_ROOT=$NDK_ROOT"
            echo "NDK_TOOLCHAIN=$TOOLCHAIN"
            echo "CC_aarch64-linux-android=$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang"
            echo "CXX_aarch64-linux-android=$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang++"
            echo "AR_aarch64-linux-android=$TOOLCHAIN/bin/llvm-ar"
            echo "RANLIB_aarch64-linux-android=$TOOLCHAIN/bin/llvm-ranlib"
            echo "STRIP_aarch64-linux-android=$TOOLCHAIN/bin/llvm-strip"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang"
            # bindgen's libclang must parse V8 headers for the android triple
            # using the NDK sysroot; without this it falls back to host glibc
            # headers and fails on bits/wordsize.h.
            echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64-linux-android=--sysroot=$TOOLCHAIN/sysroot -target aarch64-linux-android${ANDROID_API}"
            echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=--sysroot=$TOOLCHAIN/sysroot -target aarch64-linux-android${ANDROID_API}"
          } >> "$GITHUB_ENV"
          "$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang" --version
          df -h /

      - name: Add Rust target
        run: rustup target add aarch64-linux-android

      # The published v8 crate strips parts of Chromium's tree that its own GN
      # build needs on Android:
      #   * third_party/icu/{common,android}/icudtl.dat
      #   * build/android/**/*.pydeps manifests
      #   * third_party/rust/chromium_crates_io/vendor (Temporal)
      #   * the android_ndk_version GN variable and use_sysroot handling
      # Patch them here; .cargo-ok prevents cargo from re-extracting the crate.
      - name: Prepare v8 crate for Android cross-build
        working-directory: src
        run: |
          set -euo pipefail
          cargo fetch --target aarch64-linux-android
          CACHE=$(find "$HOME/.cargo/registry/cache" -name 'v8-150.4.0.crate' | head -1)
          SRC_HASH=$(basename "$(dirname "$CACHE")")
          SRC_ROOT="$HOME/.cargo/registry/src/$SRC_HASH"
          V8_SRC="$SRC_ROOT/v8-150.4.0"
          mkdir -p "$SRC_ROOT"
          tar xzf "$CACHE" -C "$SRC_ROOT"
          printf '{"v":1}' > "$V8_SRC/.cargo-ok"
          mkdir -p "$V8_SRC/third_party/android_toolchain"
          ln -sfn "$ANDROID_NDK_HOME" "$V8_SRC/third_party/android_ndk"
          ln -sfn "$ANDROID_NDK_HOME" "$V8_SRC/third_party/android_toolchain/ndk"

          # The crate strips the ICU data bundles; Chromium's ICU-77 data for
          # Chromecast ships in the crate and matches the vendored ICU version.
          mkdir -p "$V8_SRC/third_party/icu/common" "$V8_SRC/third_party/icu/android"
          cp "$V8_SRC/third_party/icu/chromecast_video/icudtl.dat" \
             "$V8_SRC/third_party/icu/common/icudtl.dat"
          cp "$V8_SRC/third_party/icu/chromecast_video/icudtl.dat" \
             "$V8_SRC/third_party/icu/android/icudtl.dat"

          # Empty .pydeps placeholders (they only describe Python test deps).
          for d in "$V8_SRC/build/android" "$V8_SRC/build"; do
            ( cd "$d"
              grep -rhoE '"[^"]+\.pydeps"' --include=BUILD.gn . | tr -d '"' | sort -u |
              while read -r f; do
                f="${f#//build/}"; f="${f#./}"
                mkdir -p "$(dirname "$f")"
                [ -f "$f" ] || touch "$f"
              done )
          done

          # GN's use_sysroot default is CPU-based and cannot be overridden from
          # --args, so force it off in the vendored gn file.
          python3 - "$V8_SRC/build/toolchain/sysroot.gni" <<'PYEOF'
          import re, sys
          p = sys.argv[1]
          s = open(p).read()
          s2 = re.sub(r'use_sysroot\s*=\s*current_cpu == "x86"[^}]*', 'use_sysroot = false\n', s, flags=re.S)
          assert s2 != s, "use_sysroot default block not found"
          open(p, "w").write(s2)
          PYEOF

          # rusty_v8's android branch pushes use_sysroot=true; GN takes the
          # first duplicate --args value, so remove the push entirely.
          python3 - "$V8_SRC/build.rs" <<'PYEOF'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          needle = 'gn_args.push("use_sysroot=true".to_string());'
          n = s.count(needle)
          assert n >= 1, "use_sysroot push not found"
          s = s.replace(needle, '// patched: host uses system headers, android uses the NDK sysroot')
          open(p, "w").write(s)
          print(f"removed {n} use_sysroot=true pushes")
          PYEOF

          # deno_core's uv_compat only implements errno_location for
          # macos/linux; Android (bionic) exposes __errno() instead.
          DC_CACHE=$(find "$HOME/.cargo/registry/cache" -name 'deno_core-0.412.0.crate' | head -1)
          tar xzf "$DC_CACHE" -C "$SRC_ROOT"
          DC_SRC="$SRC_ROOT/deno_core-0.412.0"
          printf '{"v":1}' > "$DC_SRC/.cargo-ok"
          python3 - "$DC_SRC/uv_compat/tty.rs" <<'PYEOF'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          old = '  #[cfg(not(any(target_os = "macos", target_os = "linux")))]'
          new = '''  #[cfg(target_os = "android")]
          fn errno_location() -> *mut c_int {
            unsafe extern "C" {
              fn __errno() -> *mut c_int;
            }
            unsafe { __errno() }
          }

          #[cfg(not(any(target_os = "macos", target_os = "linux", target_os = "android")))]'''
          assert old in s, "deno_core errno_location block not found"
          open(p, "w").write(s.replace(old, new, 1))
          PYEOF

          sed -i 's|^  android_ndk_root = "//third_party/android_toolchain/ndk"$|  android_ndk_root = "//third_party/android_toolchain/ndk"\n  android_ndk_version = "26"|' \
            "$V8_SRC/build/config/android/config.gni"

          # Allow a device-generated snapshot to substitute for the broken
          # cross-mksnapshot path (see tools/obscura-snapshot).
          python3 - crates/obscura-js/build.rs <<'PYEOF'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          s = p.read_text()
          anchor = "    if is_cross {"
          inject = """    if is_cross {
        if let Ok(external) = std::env::var("OBSCURA_SNAPSHOT_BIN") {
            std::fs::copy(&external, &snapshot_path).expect("copy OBSCURA_SNAPSHOT_BIN");
            println!("cargo:rustc-env=OBSCURA_SNAPSHOT_PATH={}", snapshot_path.display());
            return;
        }"""
          assert anchor in s
          p.write_text(s.replace(anchor, inject, 1))
          PYEOF
          grep -n "OBSCURA_SNAPSHOT_BIN" crates/obscura-js/build.rs
          cat tools/obscura-snapshot/Cargo.toml 2>/dev/null || true

      # Reuse the expensive V8 object trees between runs. Ninja validates
      # inputs itself, so a stale cache only costs a rebuild, never a bad link.
      - name: Restore V8 build cache
        id: v8cache
        uses: actions/cache/restore@v4
        with:
          path: |
            src/target/release/gn_out
            src/target/aarch64-linux-android/release/gn_out
          key: v8-android-${{ hashFiles('src/Cargo.lock') }}
          restore-keys: v8-android-

      - name: Install V8's pinned Chromium clang
        run: |
          set -euo pipefail
          V8_SRC=$(find "$HOME/.cargo/registry/src" -maxdepth 2 -type d -name 'v8-150.4.0' | head -1)
          python3 "$V8_SRC/tools/clang/scripts/update.py" \
            --output-dir "$RUNNER_TEMP/clang-v8"
          echo "CLANG_BASE_PATH=$RUNNER_TEMP/clang-v8" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/clang-v8/bin/clang" --version
          ls -d "$RUNNER_TEMP/clang-v8/lib/clang/23"

      - name: Build Android snapshot generator
        working-directory: src
        env:
          GN_ARGS: 'use_glib=false use_sysroot=false android_ndk_root="//third_party/android_toolchain/ndk" v8_enable_temporal_support=false'
        run: |
          set -o pipefail
          cargo build --release --target aarch64-linux-android \
            --manifest-path tools/obscura-snapshot/Cargo.toml \
            --target-dir target 2>&1 | tee snapshot-build.log
          ls -lh target/aarch64-linux-android/release/obscura-snapshot
          mkdir -p dist-snapshot
          cp target/aarch64-linux-android/release/obscura-snapshot dist-snapshot/
          cp "$NDK_TOOLCHAIN/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" dist-snapshot/
          tar czf obscura-snapshot-aarch64-android.tar.gz -C dist-snapshot .

      - name: Upload snapshot generator
        uses: actions/upload-artifact@v4
        with:
          name: obscura-snapshot-aarch64-android
          path: src/obscura-snapshot-aarch64-android.tar.gz
          if-no-files-found: error

      - name: Check for device-generated snapshot
        id: snap
        run: |
          if [ -f assets/snapshot/OBSCURA_SNAPSHOT.bin ]; then
            echo "have=1" >> "$GITHUB_OUTPUT"
            ls -l assets/snapshot/OBSCURA_SNAPSHOT.bin
          else
            echo "have=0" >> "$GITHUB_OUTPUT"
            echo "::warning::snapshot/OBSCURA_SNAPSHOT.bin not committed yet; run obscura-snapshot on an arm64 Android device and commit its output."
          fi

      - name: Build obscura (no-render, no-stealth)
        if: steps.snap.outputs.have == '1'
        working-directory: src
        env:
          GN_ARGS: 'use_glib=false use_sysroot=false android_ndk_root="//third_party/android_toolchain/ndk" v8_enable_temporal_support=false'
          OBSCURA_SNAPSHOT_BIN: ${{ github.workspace }}/assets/snapshot/OBSCURA_SNAPSHOT.bin
        run: |
          set -o pipefail
          cargo build --release --target aarch64-linux-android \
            -p obscura-cli --bins --no-default-features 2>&1 | tee build.log

      - name: Inspect and package
        if: steps.snap.outputs.have == '1'
        working-directory: src
        run: |
          set -euo pipefail
          BIN=target/aarch64-linux-android/release
          mkdir -p dist
          cp "$BIN/obscura" "$BIN/obscura-worker" dist/
          # v8 links -lc++_shared on Android (use_custom_libcxx is disabled by
          # deno_v8), so ship the NDK runtime next to the binaries.
          cp "$NDK_TOOLCHAIN/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" dist/
          ls -l dist
          python3 - <<'PY'
          import struct, pathlib
          for p in ("dist/obscura", "dist/obscura-worker"):
              d = pathlib.Path(p).read_bytes()
              assert d[:4] == b"\x7fELF", p
              machine = struct.unpack_from("<H", d, 0x12)[0]
              interp = ""
              phoff, phentsize, phnum = struct.unpack_from("<Q", d, 0x20)[0], struct.unpack_from("<H", d, 0x36)[0], struct.unpack_from("<H", d, 0x38)[0]
              for i in range(phnum):
                  o = phoff + i * phentsize
                  if struct.unpack_from("<I", d, o)[0] == 3:
                      off, sz = struct.unpack_from("<Q", d, o + 8)[0], struct.unpack_from("<Q", d, o + 32)[0]
                      interp = d[off:off+sz].decode().rstrip("\0")
              print(f"{p}: size={len(d)} e_machine=0x{machine:x} interp={interp!r}")
              assert machine == 0xB7, "not aarch64"
              assert interp == "/system/bin/linker64", "not an Android/bionic binary"
          PY
          tar czf obscura-aarch64-android.tar.gz -C dist .

      - name: Upload obscura package
        if: steps.snap.outputs.have == '1'
        uses: actions/upload-artifact@v4
        with:
          name: obscura-aarch64-android
          path: src/obscura-aarch64-android.tar.gz
          if-no-files-found: error

      - name: Save V8 build cache
        if: always() && steps.v8cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            src/target/release/gn_out
            src/target/aarch64-linux-android/release/gn_out
          key: v8-android-${{ hashFiles('src/Cargo.lock') }}

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            src/build.log
            src/snapshot-build.log
            src/target/aarch64-linux-android/release/build/**/output
          if-no-files-found: ignore
