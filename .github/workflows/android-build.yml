name: Android aarch64 build

# Builds upstream Obscura for aarch64-linux-android (bionic) from source.
#
# Why this exists: obscura links V8 through rusty_v8, which publishes prebuilt
# archives only for the five desktop targets in release.yml. Android therefore
# requires V8_FROM_SOURCE=1 (rusty_v8 builds V8 with the NDK, GN + ninja).
on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream obscura ref (branch, tag or sha)"
        required: false
        default: main
  push:
    branches: [android]

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      V8_FROM_SOURCE: "1"
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      RUST_BACKTRACE: "1"
      OBSCURA_REF: ${{ inputs.upstream_ref || 'main' }}
      ANDROID_API: "24"

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/node_modules /usr/share/swift /opt/az /usr/lib/jvm \
            /usr/local/share/powershell 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Checkout obscura
        uses: actions/checkout@v4
        with:
          repository: h4ckf0r0day/obscura
          ref: ${{ env.OBSCURA_REF }}
          path: src
          persist-credentials: false

      # The runner image already ships cmake, ninja and python3. apt is only a
      # fallback: apt mirrors on hosted runners intermittently fail to resolve
      # (azure.archive.ubuntu.com), so avoid a hard dependency on it.
      - name: Ensure cmake / ninja / python
        run: |
          set -euo pipefail
          if ! command -v cmake >/dev/null || ! command -v ninja >/dev/null; then
            sudo apt-get update -o Acquire::Retries=5 || true
            sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 \
              cmake ninja-build unzip
          fi
          cmake --version | head -1
          ninja --version
          python3 --version

      # rusty_v8 bindgen + V8 both need Clang 19+ (V8 150 uses libc++ builtin
      # type traits that Clang 18 cannot parse). Prefer the prebuilt LLVM
      # tarball over apt to dodge flaky Ubuntu mirrors.
      - name: Install LLVM 19 (prebuilt)
        id: llvm
        continue-on-error: true
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "19"
          directory: ${{ runner.temp }}/llvm

      - name: Configure LLVM 19
        run: |
          set -euo pipefail
          # install-llvm-action v2 exports LLVM_PATH (it has no LLVM_PATH output).
          LLVM_DIR="${LLVM_PATH:-}"
          if [ -z "$LLVM_DIR" ] || [ ! -x "$LLVM_DIR/bin/clang" ]; then
            echo "prebuilt LLVM unavailable, falling back to apt (10 min cap)"
            timeout 600 sudo apt-get update -o Acquire::Retries=2 || true
            timeout 600 sudo apt-get install -y --no-install-recommends \
              -o Acquire::Retries=2 clang-19 libclang-19-dev lld-19 llvm-19-dev
            LLVM_DIR=/usr/lib/llvm-19
          fi
          echo "CLANG_BASE_PATH=$LLVM_DIR" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$LLVM_DIR/lib" >> "$GITHUB_ENV"
          echo "$LLVM_DIR/bin" >> "$GITHUB_PATH"
          "$LLVM_DIR/bin/clang" --version
          ls "$LLVM_DIR/lib"/libclang.so* | head -1

      - name: Install Android NDK r26c
        run: |
          NDK_ROOT="$RUNNER_TEMP/android-ndk-r26c"
          if [ ! -d "$NDK_ROOT" ]; then
            curl -fL --retry 3 -o "$RUNNER_TEMP/ndk.zip" \
              https://dl.google.com/android/repository/android-ndk-r26c-linux.zip
            unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP"
            rm -f "$RUNNER_TEMP/ndk.zip"
          fi
          TOOLCHAIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64"
          {
            echo "ANDROID_NDK_HOME=$NDK_ROOT"
            echo "ANDROID_NDK_ROOT=$NDK_ROOT"
            echo "NDK_TOOLCHAIN=$TOOLCHAIN"
            echo "CC_aarch64-linux-android=$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang"
            echo "CXX_aarch64-linux-android=$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang++"
            echo "AR_aarch64-linux-android=$TOOLCHAIN/bin/llvm-ar"
            echo "RANLIB_aarch64-linux-android=$TOOLCHAIN/bin/llvm-ranlib"
            echo "STRIP_aarch64-linux-android=$TOOLCHAIN/bin/llvm-strip"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang"
          } >> "$GITHUB_ENV"
          "$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang" --version
          df -h /

      - name: Add Rust target
        run: rustup target add aarch64-linux-android

      # rusty_v8 150 vendors V8's Chromium build/ files, but its android
      # config expects the NDK at //third_party/android_toolchain/ndk and reads
      # an `android_ndk_version` GN variable that the vendored tree does not
      # declare. Point both at the NDK r26c we installed and pin the version.
      - name: Prepare v8 crate for Android cross-build
        run: |
          set -euo pipefail
          cargo fetch --target aarch64-linux-android
          CACHE=$(find "$HOME/.cargo/registry/cache" -name 'v8-150.4.0.crate' | head -1)
          SRC_HASH=$(basename "$(dirname "$CACHE")")
          SRC_ROOT="$HOME/.cargo/registry/src/$SRC_HASH"
          V8_SRC="$SRC_ROOT/v8-150.4.0"
          mkdir -p "$SRC_ROOT"
          tar xzf "$CACHE" -C "$SRC_ROOT"
          printf '{"v":1}' > "$V8_SRC/.cargo-ok"
          mkdir -p "$V8_SRC/third_party/android_toolchain"
          ln -sfn "$ANDROID_NDK_HOME" "$V8_SRC/third_party/android_ndk"
          ln -sfn "$ANDROID_NDK_HOME" "$V8_SRC/third_party/android_toolchain/ndk"
          # android_ndk_version is referenced by build/config/android/BUILD.gn
          # but never declared in the vendored config.gni.
          sed -i 's|^  android_ndk_root = "//third_party/android_toolchain/ndk"$|  android_ndk_root = "//third_party/android_toolchain/ndk"\n  android_ndk_version = "26"|' \
            "$V8_SRC/build/config/android/config.gni"
          grep -n "android_ndk_version" "$V8_SRC/build/config/android/config.gni"
          ls -l "$V8_SRC/third_party/android_toolchain/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"

      - name: Build obscura (no-render, no-stealth)
        working-directory: src
        env:
          # use_glib=false: V8-as-a-library never uses glib, and the hosted
          # runner lacks libglib2.0-dev. GN's host-side tools would otherwise
          # run pkg-config for glib and abort.
          GN_ARGS: 'use_glib=false android_ndk_root="//third_party/android_toolchain/ndk"'
        run: |
          cargo build --release --target aarch64-linux-android \
            -p obscura-cli --bins --no-default-features -v 2>&1 | tee build.log

      - name: Inspect and package
        working-directory: src
        run: |
          set -euo pipefail
          BIN=target/aarch64-linux-android/release
          mkdir -p dist
          cp "$BIN/obscura" "$BIN/obscura-worker" dist/
          # v8 links -lc++_shared on Android (use_custom_libcxx is disabled by
          # deno_v8), so ship the NDK runtime next to the binaries.
          cp "$NDK_TOOLCHAIN/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" dist/
          ls -l dist
          python3 - <<'PY'
          import struct, pathlib
          for p in ("dist/obscura", "dist/obscura-worker"):
              d = pathlib.Path(p).read_bytes()
              assert d[:4] == b"\x7fELF", p
              machine = struct.unpack_from("<H", d, 0x12)[0]
              interp = ""
              phoff, phentsize, phnum = struct.unpack_from("<Q", d, 0x20)[0], struct.unpack_from("<H", d, 0x36)[0], struct.unpack_from("<H", d, 0x38)[0]
              for i in range(phnum):
                  o = phoff + i * phentsize
                  if struct.unpack_from("<I", d, o)[0] == 3:
                      off, sz = struct.unpack_from("<Q", d, o + 8)[0], struct.unpack_from("<Q", d, o + 32)[0]
                      interp = d[off:off+sz].decode().rstrip("\0")
              print(f"{p}: size={len(d)} e_machine=0x{machine:x} interp={interp!r}")
              assert machine == 0xB7, "not aarch64"
              assert interp == "/system/bin/linker64", "not an Android/bionic binary"
          PY
          tar czf obscura-aarch64-android.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obscura-aarch64-android
          path: src/obscura-aarch64-android.tar.gz
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            src/build.log
            src/target/aarch64-linux-android/release/build/**/output
            src/target/aarch64-linux-android/release/gn_out/args.gn
          if-no-files-found: ignore
